<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3a2b">
<meta name="description" content="A golf career simulator from 1960 to today: real golfers, majors, sponsors, training and Dudes mode.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tour Card">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Tour Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#0f3a2b;--pine-d:#0a281e;--pine-l:#17563f;--pine-ll:#2a7055;
  --board:#fafaf5;--board-2:#eceee5;--ink:#17211b;--muted:#66766c;--line:#d8ddd1;
  --red:#c8102e;--over:#1a5a3e;--flag:#f3c433;--flag-h:#ffd650;--hl:#fff1bd;
  --txt:#eef3ee;--txt-2:#b9cdc1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pine);color:var(--txt);font:15px/1.5 'Libre Franklin',system-ui,-apple-system,sans-serif;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 70px,transparent 70px 140px);min-height:100vh}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit}
table{color:inherit}
.btn{font:700 16px/1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.08em;text-transform:uppercase;border:0;border-radius:2px;padding:11px 16px;cursor:pointer;background:var(--flag);color:var(--pine-d)}
.btn:hover{background:var(--flag-h)}
.btn.dk{background:var(--pine);color:#fff}.btn.dk:hover{background:var(--pine-l)}
.btn.gh{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn.gh:hover{background:rgba(127,127,127,.12)}
.btn.sm{font-size:14px;padding:8px 11px}
.btn:disabled{opacity:.38;cursor:not-allowed}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:18px}
.g2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.g2{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--board);color:var(--ink);border-radius:3px;box-shadow:0 0 0 4px var(--pine-d),0 14px 30px rgba(0,0,0,.32);overflow:hidden}
.bh{background:var(--pine-l);color:#fff;font:700 15px/1.1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.13em;text-transform:uppercase;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.bb{padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font:600 11px/1.2 'Libre Franklin',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.badge{display:inline-block;font:700 12px/1 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:2px;background:var(--flag);color:var(--pine-d)}
.badge.red{background:var(--red);color:#fff}.badge.gr{background:var(--board-2);color:var(--ink)}.badge.pn{background:var(--pine);color:#fff}
.u{color:var(--red)}.o{color:var(--over)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
p{margin:0 0 10px}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-block:6px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.pname{font:800 36px/.92 'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.psub{color:var(--txt-2);font-size:13px;margin-top:4px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{background:var(--board);color:var(--ink);min-width:62px;padding:5px 9px 6px;border-radius:2px}
.tile b{display:block;font:700 22px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.tile span{font:600 9.5px/1 'Libre Franklin',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.ebar{height:4px;background:var(--board-2);margin-top:4px}.ebar i{display:block;height:100%;background:var(--over)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-block:12px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.tab{background:none;border:0;color:var(--txt-2);font:700 16px/1 'Barlow Condensed',sans-serif;letter-spacing:.09em;text-transform:uppercase;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:#fff;border-color:var(--flag)}.tab:hover{color:#fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--flag);margin-left:5px;vertical-align:2px}

/* event card */
.evn{font:800 34px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.evc{color:var(--muted);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-block:12px;font-size:13.5px}
.meta b{font-weight:600}
.why{font-size:13px;color:var(--muted);margin:10px 0 0}

/* leaderboard */
.lb{width:100%;border-collapse:collapse;font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.lb th{font-size:12px;font-weight:700;letter-spacing:.14em;color:#fff;background:var(--pine);padding:7px 8px;text-align:center;text-transform:uppercase}
.lb td{padding:4px 8px;border-bottom:1px solid var(--line);font-size:20px;font-weight:600;text-align:center;white-space:nowrap}
.lb td.nm{text-align:left;letter-spacing:.03em;text-transform:uppercase}
.lb td.nm small{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-left:6px}
.lb td.tp{font-weight:800;font-size:22px}
.lb td.rd{color:var(--muted);font-weight:500;font-size:17px}
.lb tr.me td{background:var(--hl)}
.lb tr.gap td{font-size:13px;color:var(--muted);padding:2px;letter-spacing:.2em}
.lb tr.cutl td{background:var(--red);color:#fff;font-size:12px;letter-spacing:.2em;padding:3px}
.lb tr.mc td{color:#9aa69f}
.lb td.nm.legend{font-weight:700}

/* scorecard */
.card{border-collapse:collapse;font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;min-width:560px;width:100%}
.card th,.card td{border:1px solid var(--line);text-align:center;height:30px;font-size:16px;padding:0 2px}
.card th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700;background:var(--board-2)}
.card td.tt{font-weight:800;background:var(--board-2)}
.sc{display:inline-grid;place-items:center;width:23px;height:23px;font-weight:700}
.sc.b{border:1.5px solid var(--red);border-radius:50%;color:var(--red)}
.sc.e{border:1.5px solid var(--red);border-radius:50%;color:var(--red);box-shadow:0 0 0 2px var(--board),0 0 0 3.5px var(--red)}
.sc.a{background:var(--red);color:#fff;border-radius:50%}
.sc.k{border:1.5px solid var(--ink)}
.sc.d{border:1.5px solid var(--ink);box-shadow:0 0 0 2px var(--board),0 0 0 3.5px var(--ink)}
.legend-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend-key .sc{width:16px;height:16px;font-size:10px}

/* choices */
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:block;text-align:left;width:100%;background:var(--board);border:2px solid var(--line);border-radius:3px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--pine-l)}
.opt.on{border-color:var(--pine);background:#e7f0ea}
.opt b{display:block;font:700 19px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.opt span{font-size:13px;color:var(--muted)}
.opt .pct{float:right;font:800 22px/1 'Barlow Condensed',sans-serif;color:var(--pine-l)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.seg{grid-template-columns:minmax(0,1fr)}}

/* bars */
.attr{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.attr .v{font:800 22px/1 'Barlow Condensed',sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--board-2);position:relative;border-radius:1px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--pine-l)}
.bar em{position:absolute;top:0;bottom:0;background:var(--flag)}
@media (max-width:480px){.attr{grid-template-columns:100px minmax(0,1fr) 38px}}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{text-align:left;font:600 11px/1.2 'Libre Franklin',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--ink)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.me td{background:var(--hl);font-weight:600}
.tbl td.n{text-align:right}.tbl th.n{text-align:right}
.mg td{text-align:center;font:700 16px/1 'Barlow Condensed',sans-serif}
.mg td.w{background:var(--flag);color:var(--pine-d)}
.mg td.t{color:var(--pine-l)}
.mg td.x{color:#a8b2ab;font-weight:500}

/* stat tiles in boards */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:var(--board);padding:10px 12px}
.stats b{display:block;font:800 28px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.stats span{font:600 10px/1.2 'Libre Franklin',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* news */
.news{display:grid;gap:0}
.ni{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px}
.ni:last-child{border-bottom:0}
.ni .d{font:700 13px/1.3 'Barlow Condensed',sans-serif;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ni .t{font:italic 500 16.5px/1.35 'Newsreader',Georgia,serif}
.ni.me .t{color:var(--pine-l)}
.ni.big .t{font-size:18px;font-weight:500}

/* forms */
.fld{display:grid;gap:6px}
.fld label{font:600 11px/1.2 'Libre Franklin',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],select{font:500 16px 'Libre Franklin',sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);width:100%;color-scheme:light}
.pick{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pc{border:2px solid var(--line);border-radius:3px;padding:12px;cursor:pointer;background:#fff;text-align:left;color:var(--ink)}
.pc:hover{border-color:var(--pine-ll)}
.pc.on{border-color:var(--pine);background:#e7f0ea;box-shadow:inset 4px 0 0 var(--pine)}
.pc b{display:block;font:700 20px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em}
.pc .yr{font:800 26px/1 'Barlow Condensed',sans-serif;color:var(--red)}
.pc span{font-size:13px;color:var(--muted);display:block;margin-top:4px}

/* title */
.title{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;text-align:center;padding-block:56px 30px;gap:24px}
.tl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tl span{display:inline-grid;place-items:center;width:clamp(40px,9vw,78px);height:clamp(54px,12vw,100px);background:var(--board);color:var(--pine);font:800 clamp(38px,8.4vw,76px)/1 'Barlow Condensed',sans-serif;border-radius:2px;box-shadow:0 0 0 3px var(--pine-d),0 6px 0 var(--pine-d)}
.tl span.r{color:var(--red)}
.tl .sp{width:clamp(10px,2vw,20px);background:none;box-shadow:none}
.tsub{font:italic 500 21px/1.4 'Newsreader',Georgia,serif;color:var(--txt-2);max-width:40ch}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:900px;width:100%;text-align:left}
.feat div{border-top:2px solid var(--flag);padding-top:10px;color:var(--txt-2);font-size:14px}
.feat b{display:block;color:#fff;font:700 18px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

.big-pos{font:800 64px/.9 'Barlow Condensed',sans-serif}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ach div{border:1px solid var(--line);padding:8px 10px;border-radius:2px}
.ach div.got{border-color:var(--flag);background:#fff8dc}
.ach b{display:block;font:700 16px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em}
.ach span{font-size:12px;color:var(--muted)}
.ach div:not(.got) b{color:#9aa69f}
.cupscore{display:flex;gap:16px;align-items:center;justify-content:center;margin-block:8px 16px}
.cupscore .s{font:800 58px/1 'Barlow Condensed',sans-serif;background:var(--board-2);padding:6px 16px;min-width:110px;text-align:center}
.cupscore .tm{font:700 18px/1 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.alert{background:var(--flag);color:var(--pine-d);padding:14px 16px;border-radius:3px;display:grid;gap:8px}
.alert h3{font:800 22px/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--pine)}
.meter{position:relative;height:46px;background:linear-gradient(90deg,#e4e8df,#fff 50%,#e4e8df);border:2px solid var(--ink);border-radius:2px;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:#b9dcc6}.meter .core{position:absolute;top:0;bottom:0;background:var(--pine-ll)}
.meter .mk{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--red);box-shadow:0 0 0 1px #fff}
details.imp{width:100%;max-width:960px;text-align:left;color:var(--txt-2)}details.imp summary{cursor:pointer;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fff}
details.imp textarea{width:100%;margin-top:8px;font:12px ui-monospace,Menlo,monospace;padding:8px;border-radius:2px;border:2px solid var(--line);color-scheme:light}
.gazette .bb{padding:22px}.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:3px double var(--ink);padding-bottom:8px;font:600 11px 'Libre Franklin',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap}
.mast b{font:700 clamp(26px,5vw,44px)/1 'Newsreader',Georgia,serif;letter-spacing:0;text-transform:none;color:var(--ink)}
.gh1{font:700 clamp(28px,5vw,46px)/1.05 'Newsreader',Georgia,serif;margin:16px 0 8px;letter-spacing:-.01em}
.gdeck{font:italic 500 19px/1.4 'Newsreader',Georgia,serif;color:#3c4a42;margin:0 0 14px}
.gcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;border-top:1px solid var(--line);padding-top:12px;font:400 15px/1.45 'Newsreader',Georgia,serif}
.gcols h4{font:700 12px 'Libre Franklin',sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px;color:var(--muted)}
.gcols ul{margin:0 0 10px;padding-left:18px}.gcols p{margin:0 0 8px}
@media (max-width:760px){.gcols{grid-template-columns:minmax(0,1fr)}}
.shotgrid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start;margin-top:8px}
@media (max-width:460px){.shotgrid{grid-template-columns:minmax(0,1fr)}}
.ccard{max-width:100%;border-radius:4px;display:block}
hr.s{border:0;border-top:1px solid var(--line);margin:14px 0}

body.dz{--pine:#29230f;--pine-d:#1a160a;--pine-l:#5c4b16;--pine-ll:#806a22;--flag:#e9bc3c;--flag-h:#f7cf58;--txt-2:#d9cca4;--hl:#fbefc4}
.pc.gold{border-color:#dcb24a;background:#fffaf0}.pc.gold.on{border-color:#a67c00;background:#fbefc8;box-shadow:inset 4px 0 0 #a67c00}
.dzb .bh{background:linear-gradient(90deg,#6b5414,#a8831f)}
.dz-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.dztag{display:inline-block;background:linear-gradient(90deg,#a8831f,#e9bc3c);color:#1a160a;font:800 11px/1 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:3px 6px;border-radius:2px;vertical-align:2px}
.cad{margin:10px 0 0;padding:8px 10px;border-left:4px solid var(--flag);background:#fff8dc;font:italic 500 16px/1.35 'Newsreader',Georgia,serif}
.tvl{font:italic 500 16.5px/1.35 'Newsreader',Georgia,serif}
.gstep{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:7px;border-bottom:1px solid var(--line)}
.gstep b{display:block;font:700 17px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em}
.gstep .gck{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--pine-d)}
.gstep.ok .gck{background:var(--flag);border-color:var(--flag)}.gstep.ok b{text-decoration:line-through;color:var(--muted)}
.guide .bh{background:var(--red)}
.tile[title]{cursor:help}
@media (max-width:640px){
 .pname{font-size:28px}
 .top{gap:10px}
 .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;gap:4px}
 .tile{min-width:0;padding:4px 6px}.tile b{font-size:18px}.tile span{font-size:8.5px}
 .bb{padding:12px}.bh{padding:9px 12px}
 .evn{font-size:26px}
 .lb td{font-size:17px;padding:4px 5px}.lb td.tp{font-size:18px}.lb td.rd{font-size:14px;padding:4px 3px}.lb th{padding:6px 4px}
 .lb td.nm small{display:none}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats b{font-size:22px}
 .row>.btn{flex:1 1 auto}
 .big-pos{font-size:48px}
 .tab{padding:10px 10px;font-size:15px}
 .ni{grid-template-columns:minmax(0,1fr);gap:2px}
 .pick{grid-template-columns:minmax(0,1fr)}
 .card{min-width:470px}
 .opt{padding:10px 12px}.opt b{font-size:17px}
 .gstep{grid-template-columns:22px minmax(0,1fr)}.gstep .btn{grid-column:2;justify-self:start}
 .title{padding-block:30px 20px}.tsub{font-size:18px}
 .tl{gap:4px}.tl span{width:34px;height:48px;font-size:34px;box-shadow:0 0 0 2px var(--pine-d),0 4px 0 var(--pine-d)}.tl .sp{width:8px}
 .tbl td,.tbl th{padding:6px 5px}
}

/* iPhone & touch */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:rgba(0,0,0,0);overscroll-behavior-y:none}
button,select,input,label,.opt,.pc,.tab{touch-action:manipulation}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.tabs{position:sticky;top:env(safe-area-inset-top);z-index:20;background:var(--pine);box-shadow:0 8px 12px -10px rgba(0,0,0,.6)}
@media (pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:40px}.tab{min-height:46px}.toggle{min-height:40px}.toggle input{width:22px;height:22px}select,input[type=text],input[type=number]{min-height:44px}.opt{min-height:48px}}
@media (max-width:640px){.wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}}


/* player card */
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:linear-gradient(135deg,var(--pine-l),var(--pine-d));border-radius:4px;padding:18px;box-shadow:0 0 0 2px var(--pine-d),0 14px 30px rgba(0,0,0,.3);margin-top:4px}

let RNG=Math.random;const rnd=()=>RNG();function seedRng(x){RNG=x==null?Math.random:mulberry(x);}
function gauss(r=rnd){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sgauss(key){return gauss(mulberry(hash(key)));}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(rnd()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tp=v=>v===0?'E':v>0?'+'+v:''+v;
const tpc=v=>v<0?'u':v>0?'o':'';
function money(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);let s;if(n>=1e6)s='$'+(n/1e6).toFixed(n>=1e8?0:n>=1e7?1:2)+'M';else s='$'+n.toLocaleString('en-US');return (neg?'−':'')+s;}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function interp(pts,y,log){if(y<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++){if(y<=pts[i][0]){const[a,b]=[pts[i-1],pts[i]];const t=(y-a[0])/(b[0]-a[0]);return log?Math.exp(Math.log(a[1])+t*(Math.log(b[1])-Math.log(a[1]))):a[1]+t*(b[1]-a[1]);}}return null;}

let GM=null,GMk='';
function G(id){
  if(id==='me')return{id:'me',name:S.p.name,ctry:S.p.ctry};
  if(id[0]==='r')return BYID[id];
  const k=S.genSeq+':'+S.gen.length;
  if(!GM||GMk!==k){GM={};for(const g of S.gen)GM[g.id]=g;GMk=k;}
  return GM[id];
}
const SPECIAL_LAST={'Jose Maria Olazabal':'Olazabal','Min Woo Lee':'Lee','Roberto De Vicenzo':'De Vicenzo'};
function lastN(n){if(SPECIAL_LAST[n])return SPECIAL_LAST[n];const p=n.split(' ');if(p.length>2&&/^(III|II|Jr\.?)$/.test(p[p.length-1]))return p.slice(-2).join(' ');return p.slice(1).join(' ')||n;}
function bn(id){const g=G(id);if(!g)return 'RETIRED';return (g.name[0]+'. '+lastN(g.name)).toUpperCase();}
function fn(id){const g=G(id);return g?g.name:'A retired pro';}
function curve(g,y){const age=y-g.birth,d=y-g.peakY;let r=d<0?g.peak-.35*d*d:g.peak-(.09*d*d+.3*d);if(age>42)r-=.8*Math.pow(age-42,1.5);if(age<21)r-=(21-age)*2;return r;}
function ratingAt(g,y){return curve(g,y)+sgauss(g.id+':'+y)*1.1;}
function pickCountry(y){const r=rnd();
  if(y<1980)return r<.78?'USA':pick(['ENG','SCO','AUS','RSA','ARG','JPN','NZL','CAN','IRL','ESP']);
  if(y<2000)return r<.62?'USA':pick(['ENG','SCO','AUS','RSA','ESP','SWE','GER','JPN','ARG','CAN','IRL','NZL','WAL','ZIM','FIJ']);
  return r<.5?'USA':pick(['ENG','SCO','IRL','NIR','AUS','RSA','ESP','SWE','NOR','DEN','GER','ITA','FRA','JPN','KOR','KOR','CAN','CAN','ARG','MEX','CHI','COL','CHN','IND','NZL','GRE']);}
function makeGen(y,age,phenom){
  const ctry=pickCountry(y);const pool=NAMES[CPOOL[ctry]||'us'];
  let name,tries=0;do{name=pick(pool.f)+' '+pick(pool.l);tries++;}while(tries<8&&(S.gen.some(g=>g.name===name)||REAL.some(g=>g.name===name)));
  const peakAge=28+Math.floor(rnd()*6);
  const peak=phenom?89+rnd()*7:clamp(76+gauss()*4.5,64,90);
  const st=[...new Set([pick(['P','A','I','S','U']),...(rnd()<.45?[pick(['P','A','I','S','U'])]:[])])].join('')+(rnd()<.1?'M':'');
  return{id:'g'+(S.genSeq++),name,ctry,birth:y-age,peakY:y-age+peakAge,peak:+peak.toFixed(1),st};
}
let RC=null;
function roster(y){
  const key=y+':'+S.gen.length+':'+S.genSeq;
  if(RC&&RC.key===key)return RC;
  const rating={},main=[],dev=[],liv=[],senior=[],cand=[];
  for(const g of [...REAL,...S.gen]){
    const age=y-g.birth;
    if(g.dude){if(age<DUDE_AGE||age>64)continue;const r=dudeR(g,y)+sgauss(g.id+':'+y)*.5;rating[g.id]=r;if(age>=50){if(r>=42)senior.push(g.id);}else cand.push(g.id);continue;}
    if(age<19||age>64)continue;
    let r=ratingAt(g,y);if(S.dudes)r=capReal(r);rating[g.id]=r;
    if(g.liv&&y>=g.liv&&age<56){if(r>=60)liv.push(g.id);continue;}
    if(age>=50){if(y>=1980&&r>=42)senior.push(g.id);continue;}
    if(r<55)continue;cand.push(g.id);
  }
  const stars=cand.filter(id=>id[0]==='r'&&rating[id]>=88).length;const boost=S.dudes?0:clamp((14-stars)*.3,0,3);
  if(boost)for(const id of cand)if(id[0]==='g')rating[id]+=boost;
  cand.sort((a,b)=>rating[b]-rating[a]);
  cand.forEach((id,i)=>(i<165?main:dev).push(id));
  RC={key,y,rating,main,dev,liv,senior};return RC;
}

    if(w){w.alt=a.ev;a.ev.pm=.35;}else{a.ev.type='reg';a.ev.pm=.5;weeks.push({mo:a.ev.mo,main:a.ev});}}

}
const CM={};
function courseOf(ev){
  const key=ev.cn+'|'+ev.key+'|'+ev.tour;if(CM[key])return CM[key];
  const r=mulberry(hash(key));let par=[70,71,72,72,72][Math.floor(r()*5)],prof,diff,sd=2.6,wind=false;
  if(ev.key==='masters'){prof={pow:.3,acc:.05,app:.25,sho:.15,put:.25};diff=.9;par=72;}
  else if(ev.key==='usopen'){prof={pow:.1,acc:.35,app:.3,sho:.15,put:.1};diff=2.2;par=70;}
  else if(ev.key==='open'){prof={pow:.1,acc:.2,app:.2,sho:.3,put:.2};diff=1.2;wind=true;sd=3.0;par=r()<.5?71:72;}

  if(ev.tour==='am')diff-=1.5;
  const n3=4,n5=Math.max(0,4+(par-72)),pars=Array(18).fill(4);
  const idx=[...Array(18).keys()].sort((a,b)=>hash(key+a)%97-hash(key+b)%97);
  for(let i=0;i<n3;i++)pars[idx[i]]=3;for(let i=0;i<n5;i++)pars[idx[n3+i]]=5;
  const extra=par-pars.reduce((a,b)=>a+b,0);for(let i=0,j=n3+n5;i<Math.abs(extra);i++,j++)pars[idx[j]]+=Math.sign(extra);
  const sg=SIGH.filter(x=>ev.cn.includes(x.c));
  if(sg.length){const lock=new Set();for(const x of sg){pars[x.hole-1]=x.par;lock.add(x.hole-1);}let d=par-pars.reduce((a,b)=>a+b,0),g=0;
    while(d!==0&&g++<200){const i=Math.floor(r()*18);if(lock.has(i))continue;const nv=pars[i]+Math.sign(d);if(nv<3||nv>5)continue;pars[i]=nv;d-=Math.sign(d);}}
  return CM[key]={par,prof,diff,sd,wind,pars};
}
function purseOf(ev,y){if(ev.type==='olympics'||ev.tour==='am')return 0;if(ev.tour==='liv')return 25e6*(y>2026?Math.pow(1.03,y-2026):1);if(ev.tour==='q')return avgPurse(y)*.03;return avgPurse(y)*ev.pm;}

function suits(ev){const p=courseOf(ev).prof;return Object.entries(p).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>AL[x[0]]).join(' & ');}

function sample(a,n){return a.length<=n?a.slice():shuffle(a.slice()).slice(0,n);}
function fieldFor(ev,y,withMe,excl){

  if(ev.tour==='dev')ids=sample(R.dev,ev.fieldN);
  else if(ev.tour==='am'){const pool=amPool(y);rmap={};pool.forEach(([id,r])=>rmap[id]=r);ids=sample(pool.map(x=>x[0]),ev.fieldN-1);}
  else if(ev.tour==='euro'){const pool=euroPool(y);ids=ev.type==='final'?pool.slice().sort((a,b)=>(S.moneyE[b]||0)-(S.moneyE[a]||0)).slice(0,ev.fieldN):ev.type==='wgc'?pool.slice(0,ev.fieldN):sample(pool.slice(0,140),ev.fieldN);}
  else if(ev.tour==='liv')ids=(S.livField||[]).filter(id=>R.rating[id]!==undefined);
  else if(ev.tour==='senior')ids=[...R.senior].sort((a,b)=>R.rating[b]-R.rating[a]).slice(0,ev.fieldN);
  else if(ev.tour==='q')ids=sample(R.dev.slice(0,120),99);

  else if(ev.type==='major'){const pool=[...R.main,...R.liv.filter(id=>R.rating[id]>=83||(S.majLast[id]&&y-S.majLast[id]<=5))];pool.sort((a,b)=>rk(a)-rk(b)||R.rating[b]-R.rating[a]);ids=pool.slice(0,ev.fieldN);}

  else if(ev.type==='alt')ids=sample(R.main.filter(id=>rk(id)>70),ev.fieldN);
  else if(ev.type==='sig')ids=[...R.main].sort((a,b)=>rk(a)-rk(b)||R.rating[b]-R.rating[a]).slice(0,ev.fieldN);
  else if(ev.toc){ids=R.main.filter(id=>S.lastWinners.includes(id));const more=[...R.main].sort((a,b)=>rk(a)-rk(b)).filter(id=>!ids.includes(id));while(ids.length<30&&more.length)ids.push(more.shift());}

function newT(ev,y,withMe,excl){

  const wave=[];if(E.length>40)for(let r=0;r<Math.min(2,ev.rounds);r++){const d=gauss()*.5*(c.wind?1.7:1);wave.push([+(cond[r]-d/2).toFixed(2),+(cond[r]+d/2).toFixed(2)]);}
  for(const e of E){e.w=rnd()<.5?0:1;if(e.id!=='me'){e.fit=+(fitAdj(e.id,c)+horseBonus(e.id,ev.cn)+wxFit(wx,styleOf(e.id))).toFixed(2);e.cl=styleOf(e.id).includes('M');}}
  const T={ev,y,E,round:0,cond,wave:wave.length?wave:null,strat:'bal',cards:[],pair:[],final:false,mo:null,lead:[],wx};

    if(y<=2018)ordr.slice(0,30).forEach((id,i)=>S.fedex[id]=i<5?RESET[i]:Math.max(210,1200-(i-5)*41));

}
function aiScore(T,e){const c=courseOf(T.ev);let m=(80-e.r)*K+c.diff+condFor(T,e,T.round)-(e.fit||0)+(T.wx?T.wx.d:0);if(e.cl&&lastRound(T)&&T.ev.type==='major')m-=.25;return Math.round(gauss()*c.sd+m);}
function simRoundAI(T,skip){for(const e of T.E){if(e.cut||e.id==='me'||(skip&&skip.has(e.id)))continue;const v=aiScore(T,e);e.rd.push(v);e.tot+=v;}}
function sorted(T){return [...T.E].sort((a,b)=>(a.cut-b.cut)||a.tot-b.tot||(a.id==='me'?-1:b.id==='me'?1:0));}

function finalize(T){

function rivalAfter(T,me){

/* ============ live Sunday ============ */
function normCdf(x){const t=1/(1+.2316419*Math.abs(x));const d=.3989423*Math.exp(-x*x/2);const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p;}
const PARADJ={3:.1,4:.06,5:-.25};
function liveScoreOf(T,e){const L=T.live;if(e.id==='me')return e.tot+L.me.reduce((a,b)=>a+b,0);const a=L.ai[e.id];if(!a)return e.tot;return e.tot+a.h.slice(0,L.hole).reduce((x,y)=>x+y,0);}
function liveBest(T,excl){let best=99;for(const id of Object.keys(T.live.ai).concat('me')){if(id===excl)continue;best=Math.min(best,liveScoreOf(T,T.E.find(x=>x.id===id)));}return best;}
function holeParams(T,h,choice){const L=T.live;const par=courseOf(T.ev).pars[h];let mean=L.m/18+PARADJ[par],sd=L.s/Math.sqrt(18);
  if(choice==='agg'){mean-=.07;sd*=1.3;}else if(choice==='safe'){mean+=.05;sd*=.75;}
  const me=T.E.find(e=>e.id==='me');if(h>=13&&liveScoreOf(T,me)-liveBest(T,'me')<=1){const A=effAttrs();mean+=Math.max(0,78-A.men)*.006*(T.ev.type==='major'?1.5:1)*(S.staff.psych==='yes'?.5:1);}
  return{mean,sd,par};}
function holeOdds(p){return{b:normCdf((-.5-p.mean)/p.sd),k:1-normCdf((.5-p.mean)/p.sd)};}
function holeYds(ev,h,par){const r=hash(ev.cn+':'+h);return par===3?140+r%100:par===4?350+r%140:520+r%90;}
function initLive(T){
  const c=courseOf(T.ev);const cont=sorted(T).filter(e=>!e.cut&&e.id!=='me').slice(0,7);const cset=new Set(cont.map(e=>e.id));
  simRoundAI(T,cset);
  const ai={};for(const e of cont){ai[e.id]={h:buildCard(c.pars,aiScore(T,e),{},true).h};}
  const mm=myMean(T);const me=T.E.find(e=>e.id==='me');const cond=condFor(T,me,T.round);
  const yds=c.pars.map((p,h)=>holeYds(T.ev,h,p));const his=c.pars.map((p,h)=>holeInfo(T.ev,h));
  const ctx={A:effAttrs(),off:0,wf:1+Math.max(0,cond)*.15,y:T.y,his,hi:his[0],press:false};
  calibrate(ctx,c.pars,yds,mm.m);
  return{hole:0,ai,me:[],keys:[],log:[],m:mm.m,s:mm.s,mom:[],ctx,yds,hs:newHole(c.pars[0],yds[0])};
}
function liveCtx(T){const L=T.live;const c=L.ctx;c.hi=c.his[Math.min(L.hole,17)];const me=T.E.find(e=>e.id==='me');c.press=L.hole>=13&&liveScoreOf(T,me)-liveBest(T,'me')<=1;return c;}
function liveShot(ch){const T=S.T,L=T.live;if(!L||L.hole>=18)return;const c=liveCtx(T);const st=L.hs;doShot(c,st,ch);if(st.done)finishHole(st.strokes-st.par);}
function finishHole(v){const T=S.T,L=T.live;const h=L.hole;const par=courseOf(T.ev).pars[h];
  L.me.push(v);const me=T.E.find(e=>e.id==='me');
  L.log.unshift({me:1,t:'You, hole '+(h+1)+' (par '+par+'): '+(par+v===1?'hole-in-one!':RES(v))+'. '+(L.hs.notes.slice(-1)[0]||'')+' Now at '+tp(liveScoreOf(T,me))+'.',v});
  if(par+v===1){ach('ace');fame(3);news('Hole-in-one on the '+ord(h+1)+' at '+T.ev.n+' in the final round!','big');}
  L.hole++;
  tvHole(T,h,v);
  const lead=liveBest(T,null);
  for(const id in L.ai){const hv=L.ai[id].h[h];if(hv===0)continue;const cur=liveScoreOf(T,T.E.find(x=>x.id===id));if(cur-lead>3)continue;
    L.log.unshift({t:bn(id)+' '+(hv<=-2?'eagles':hv===-1?'birdies':hv===1?'bogeys':'makes a double on')+' the '+ord(h+1)+' to get to '+tp(cur)+'.',v:hv});}
  if(L.log.length>40)L.log.length=40;
  if(L.hole>=18)finishLive();else L.hs=newHole(courseOf(T.ev).pars[L.hole],L.yds[L.hole]);
}
function finishLive(){const T=S.T,L=T.live;const me=T.E.find(e=>e.id==='me');const rel=L.me.reduce((a,b)=>a+b,0);
  me.rd.push(rel);me.tot+=rel;T.cards.push({h:L.me.slice(),ace:-1,r:T.round,mom:L.mom,live:1});
  if(rel<=-10&&T.ev.tour!=='q')ach('low');

function planPick(w){
  const p=(S.plan||{})[S.week]||'auto';const se=sideEv();const em=elig(w.main);
  if(p==='rest')return null;
  if(p==='main'&&em.ok&&w.main.type!=='team')return w.main;
  if(p==='alt'&&w.alt&&elig(w.alt).ok)return w.alt;
  if(p==='side'&&se&&elig2(se).ok)return se;
  if(S.p.inj>0||S.p.away>0)return null;
  if(em.ok&&['major','playoff','final','players','olympics','sig','wgc'].includes(w.main.type))return w.main;
  if(S.p.energy<40)return null;
  if(em.ok&&w.main.type!=='team')return w.main;
  if(w.alt&&S.tour==='main'&&elig(w.alt).ok)return w.alt;
  if(se&&elig2(se).ok)return se;

}
function autoplay(stopAtBig){
  let guard=0;const b0={n:S.res.length,y:S.year,r0:S.rankOf.me,cash:S.p.cash,wk:S.gw};
  try{return autoplayInner(stopAtBig,guard);}finally{const rs=S.res.slice(b0.n).filter(r=>r.tour!=='q');const wks=S.gw-b0.wk;S.lastBatch=wks>1?{wks,ev:rs.length,wins:rs.filter(r=>r.win).length,best:rs.filter(r=>r.pos).sort((a,b)=>a.pos-b.pos)[0]||null,money:rs.reduce((a,r)=>a+(r.money||0),0),r0:b0.r0,r1:S.rankOf.me,cuts:rs.filter(r=>r.pos).length}:null;}
}
function autoplayInner(stopAtBig,guard){
  while(S.phase==='play'&&!S.T&&guard++<80){
    if(S.cup){if(S.cup.stage==='done'){S.cup=null;advanceWeek({played:'team'});continue;}break;}
    if(S.livOffer||S.pending)break;
    const w=S.sched[S.week];const big=['major','team','olympics'].includes(w.main.type);
    if(stopAtBig&&guard>1&&big)break;
    if(w.main.type==='team'&&elig(w.main).ok&&(S.plan||{})[S.week]!=='rest'){if(stopAtBig||elig(w.main).cap)break;quickCup();continue;}
    const ev=planPick(w);

const RNDN={64:'Round of 64',32:'Round of 32',16:'Round of 16',8:'Quarterfinals',4:'Semifinals',2:'Final'};
function bracketOrder(n){let a=[1,2];while(a.length<n){const m=a.length*2+1;a=a.flatMap(x=>[x,m-x]);}return a;}
function holeMean(r,par){return (80-r)*K/18+PARADJ[par];}
function aiHole(r,par){return Math.round(gauss()*.62+holeMean(r,par));}
function sideHole(fmt,rs,par){if(fmt==='Four-balls')return Math.min(...rs.map(r=>aiHole(r,par)));return aiHole(rs.reduce((a,b)=>a+b,0)/rs.length,par);}
function simMatch(pars,ra,rb,fmt,halve){fmt=fmt||'Singles';let d=0,h=0;
  for(;h<18;h++){const a=sideHole(fmt,ra,pars[h]),b=sideHole(fmt,rb,pars[h]);d+=a<b?1:a>b?-1:0;if(17-h>0&&Math.abs(d)>17-h)break;}
  if(h<18)return{r:Math.sign(d),txt:Math.abs(d)+'&'+(17-h)};
  if(d)return{r:Math.sign(d),txt:Math.abs(d)+' up'};
  if(halve)return{r:0,txt:'All square'};
  let x=0;while(!d&&x<9){const a=sideHole(fmt,ra,pars[x%18]),b=sideHole(fmt,rb,pars[x%18]);d=a<b?1:a>b?-1:0;x++;}
  if(!d)d=rnd()<.5?1:-1;return{r:d,txt:(18+x)+' holes'};}
function setupBracket(T){
  const ev=T.ev;let pool=T.E.filter(e=>!e.cut);
  if(ev.rounds>0)pool.sort((a,b)=>a.tot-b.tot||rnd()-.5);else pool.sort((a,b)=>rk(a.id)-rk(b.id)||b.r-a.r);
  let size=ev.mp;while(size>pool.length)size/=2;
  const q=pool.slice(0,size);const qs=new Set(q.map(e=>e.id));for(const e of T.E)if(!qs.has(e.id))e.cut=true;
  if(ev.rounds>0)T.medalist=pool[0].id;
  T.mp={alive:bracketOrder(size).map(s=>q[s-1].id),rd:0,hist:[],seed:Object.fromEntries(q.map((e,i)=>[e.id,i+1]))};
}
function mpPairs(T){const a=T.mp.alive,p=[];for(let i=0;i<a.length;i+=2)p.push([a[i],a[i+1]]);return p;}
function rOf(T,id){const e=T.E.find(x=>x.id===id);return e?e.r:75;}
function myPair(T){return T.mp?mpPairs(T).find(p=>p.includes('me')):null;}
function mpRound(T,myRes){
  const pars=courseOf(T.ev).pars,res=[],next=[];
  for(const[a,b]of mpPairs(T)){let w,txt;
    if(myRes&&(a==='me'||b==='me')){w=myRes.w;txt=myRes.txt;}else{const m=simMatch(pars,[rOf(T,a)],[rOf(T,b)],'Singles',false);w=m.r>0?a:b;txt=m.txt;}
    res.push({a,b,w,txt});next.push(w);}
  T.mp.hist.push(res);T.mp.alive=next;T.mp.rd++;T.mpm=null;
  if(next.length===1){T.mp.champ=next[0];finalize(T);}
}
function mpRoundName(T){return RNDN[T.mp.alive.length]||'Round of '+T.mp.alive.length;}
function mpQuickMe(T){const p=myPair(T);if(!p){mpRound(T);return;}const opp=p[0]==='me'?p[1]:p[0];const L=T.mpm||newLM({mine:['me'],opp:[opp],rm:[rOf(T,'me')],ro:[rOf(T,opp)],pars:courseOf(T.ev).pars,big:T.ev.type!=='reg'});lmAuto(L);mpRound(T,{w:L.res>0?'me':opp,txt:L.txt});}

/* live match engine (match play and team cups) */
function newLM(o){return{fmt:o.fmt||'Singles',mine:o.mine,opp:o.opp,rm:o.rm,ro:o.ro,pars:o.pars,halve:!!o.halve,hole:0,d:0,log:[],done:false,txt:'',big:!!o.big,res:0};}
function lmMyHole(L,choice){const par=L.pars[L.hole%18];let mean=holeMean(L.rm[0],par),sd=.62;
  if(choice==='agg'){mean-=.07;sd*=1.3;}else if(choice==='safe'){mean+=.05;sd*=.75;}
  if(L.hole>=13&&Math.abs(L.d)<=1){const A=effAttrs();mean+=Math.max(0,78-A.men)*.006*(L.big?1.5:1)*(S.staff.psych==='yes'?.5:1)*DIFF().p;}
  if(L.fmt==='Foursomes')mean+=holeMean((L.rm[0]+L.rm[1])/2,par)-holeMean(L.rm[0],par);
  const mine=Math.round(gauss()*sd+mean);
  return L.fmt==='Four-balls'?Math.min(mine,aiHole(L.rm[1],par)):mine;}
const lmStatus=d=>d>0?d+' UP':d<0?(-d)+' DOWN':'ALL SQUARE';
function lmHole(L,choice){if(L.done)return;const par=L.pars[L.hole%18];const a=lmMyHole(L,choice),b=sideHole(L.fmt,L.ro,par);
  const r=a<b?1:a>b?-1:0;L.d+=r;const who=L.fmt==='Singles'?'You':'Your side';
  L.log.unshift({v:r,t:'Hole '+(L.hole+1)+' (par '+par+'): '+who+' '+RES(a)+', they '+RES(b)+'. '+(r>0?'Hole won.':r<0?'Hole lost.':'Halved.')+' '+lmStatus(L.d)+'.'});
  L.hole++;const left=18-L.hole;
  if(L.hole<18){if(Math.abs(L.d)>left){L.done=true;L.txt=Math.abs(L.d)+'&'+left;}}
  else if(L.hole===18){if(L.d){L.done=true;L.txt=Math.abs(L.d)+' up';}else if(L.halve){L.done=true;L.txt='All square';}}
  else if(L.d){L.done=true;L.txt=L.hole+' holes';}
  if(L.done)L.res=Math.sign(L.d);}
function lmAuto(L){let g=0;while(!L.done&&g++<40)lmHole(L,'std');}
function lmOdds(L,choice){let w=0,l=0;const N=300;const par=L.pars[L.hole%18];for(let i=0;i<N;i++){const a=lmMyHole(L,choice),b=sideHole(L.fmt,L.ro,par);if(a<b)w++;else if(a>b)l++;}return{w:w/N,l:l/N};}

function myTeam(){const C=S.cup;return C.mine==='A'?C.A:C.B;}

function cupSessionSetup(pairs){const C=S.cup;const[day,fmt]=CUPSESS[C.sess];
  const mine=pairs||aiPairs(myTeam(),fmt,C),opp=aiPairs(oppTeam(),fmt,C);
  const nm=Math.min(mine.length,opp.length);C.cur={fmt,day,matches:mine.slice(0,nm).map((m,i)=>({m:m.includes('me')?['me',...m.filter(x=>x!=='me')]:m,o:opp[i],r:null,txt:''}))};C.live=null;}
function cupFinishSession(){const C=S.cup;const{fmt,matches}=C.cur;const pars=cupPars();let mom=0;
  for(const mt of matches){

/* ============ shot-by-shot ============ */
const PUTT=[[1,.995],[2,.985],[3,.96],[4,.88],[5,.77],[6,.66],[8,.5],[10,.4],[12,.33],[15,.23],[20,.15],[25,.1],[30,.07],[40,.045],[60,.02],[100,.01]];
function puttP(ft){return ft>=100?.01:interp(PUTT,Math.max(1,ft),false);}
function eraDrive(y){return y<1975?240:y<1990?252:y<2000?262:y<2010?285:295;}
function holeInfo(ev,h){const r=hash(ev.cn+'#'+h);return{water:r%4===0,side:r%2?1:-1,dog:((r>>3)%3)-1};}
const LIE={tee:'Tee',fairway:'Fairway',rough:'Rough',bunker:'Fairway bunker',trees:'In the trees',sand:'Greenside bunker',fringe:'Fringe',green:'Green'};
function skl(c,k){return (c.A[k]||75)+c.off;}
function reachOf(c){return eraDrive(c.y)*.92+(skl(c,'pow')-75)*1.2;}
function newHole(par,yds){return{par,yds,dist:yds,ft:0,lie:'tee',strokes:0,shot:0,done:false,trail:[{d:yds,x:0,lie:'tee'}],notes:[]};}
function shotOpts(c,st){
  if(st.lie==='green')return[['charge','Charge it'],['normal','Normal stroke'],['lag','Lag it close']];
  if(st.lie==='tee'&&st.par===3)return[['attack','Attack the flag'],['center','Middle of the green']];
  if(st.lie==='tee'&&st.par>=4)return[['driver','Driver'],['wood','3-wood'],['iron','Long iron']];
  if(st.lie==='trees')return[['hero','Hero shot at the green'],['punch','Punch out']];
  if(st.dist<=40)return[['pitch','Go at the pin'],['safe','Play to the middle']];
  if(st.dist>reachOf(c)+15)return[['advance','Advance it'],['layup','Lay up short']];
  if(st.dist>215)return[['go','Go for the green'],['layup','Lay up']];
  return[['attack','Attack the flag'],['center','Middle of the green']];
}
function stdChoice(c,st){if(st.lie==='green')return 'normal';if(st.lie==='tee'&&st.par===3)return st.dist>170?'center':'attack';if(st.lie==='tee'&&st.par>=4)return 'driver';if(st.lie==='trees')return 'punch';if(st.dist<=40)return 'pitch';if(st.dist>reachOf(c)+15)return 'advance';if(st.dist>215)return st.dist<=reachOf(c)?'go':'layup';return st.dist>160?'center':'attack';}
function xFor(lie){return lie==='fairway'?gauss()*5:lie==='rough'?(rnd()<.5?-1:1)*(15+rnd()*8):lie==='bunker'?(rnd()<.5?-1:1)*13:lie==='trees'?(rnd()<.5?-1:1)*28:lie==='sand'?(rnd()<.5?-1:1)*18:gauss()*8;}
function onGreen(st,ft){st.lie='green';st.ft=Math.max(1,ft);st.dist=0;}
function aroundGreen(st){st.dist=8+rnd()*22;const r=rnd();st.lie=r<.3?'sand':r<.75?'rough':'fringe';}
function doShot(c,st,ch){
  st.shot++;st.strokes++;let note='';const lieMal={fairway:0,rough:.12,bunker:.2,trees:.4,fringe:0,sand:.15,tee:0}[st.lie]||0;const lieF={fairway:1,rough:1.35,bunker:1.6,trees:2.2,tee:1}[st.lie]||1;
  const app=skl(c,'app'),pw=skl(c,'pow'),ac=skl(c,'acc'),sh=skl(c,'sho'),pt=skl(c,'put');
  if(st.lie==='green'){
    let p=puttP(st.ft)*(1+(pt-75)*.012)*{charge:1.12,normal:1,lag:.8}[ch||'normal'];if(c.press)p*=1-Math.max(0,75-skl(c,'men'))*.005*DIFF().p;p=clamp(p,.003,.995);
    if(rnd()<p){note=st.ft>=15?'Drains it from '+Math.round(st.ft)+' feet!':'Holes it from '+Math.round(st.ft)+' feet.';st.done=true;st.ft=0;}
    else{const nf=ch==='charge'?2.5+rnd()*4:ch==='lag'?.5+rnd()*1.6:1+st.ft*.08+rnd()*2;note='Misses from '+Math.round(st.ft)+' feet, '+(nf<3?'leaves a tap-in.':Math.round(nf)+' feet coming back.');st.ft=nf;}
  }
  else if(st.lie==='tee'&&st.par>=4){
    const cl={driver:[1,0],wood:[.92,.1],iron:[.82,.2]}[ch]||[1,0];const carry=(eraDrive(c.y)+(pw-75)*1.3)*cl[0]+gauss()*9;
    const pf=clamp(.6+(ac-75)*.012+cl[1]-(c.wf-1)*.4,.15,.95);let lie='fairway';
    if(rnd()>pf){const r=rnd();lie=r<.6?'rough':r<.82?'bunker':r<.94?'trees':(c.hi.water?'water':'rough');}
    if(lie==='water'){st.strokes++;lie='rough';note='Into the water. Penalty drop.';}
    st.dist=Math.max(35,st.dist-carry*(lie==='trees'?.85:1));st.lie=lie;if(!note)note=Math.round(carry)+' yards, '+LIE[lie].toLowerCase()+'.';
  }
  else if(st.lie==='trees'&&ch!=='hero'){st.dist=Math.max(40,st.dist-60-rnd()*40);st.lie='fairway';note='Punched back to the fairway.';}
  else if(st.dist<=40&&st.lie!=='tee'){
    const lie=st.lie;const ho={fringe:.05,fairway:.04,rough:.03,sand:.025}[lie]||.03;const fl={sand:.09,rough:.05,fringe:.01,fairway:.02}[lie]||.03;
    if(rnd()<ho*(ch==='pitch'?1.5:.8)*(1+(sh-75)*.02)){st.done=true;note='Holes it from off the green!';}
    else if(rnd()<fl*(ch==='pitch'?1.3:.7)*clamp(1-(sh-75)*.02,.3,1.6)){st.dist=Math.max(4,st.dist*.6);note=lie==='sand'?'Leaves it in the bunker.':'Chunks it.';}
    else{const ft=(3+st.dist*.35)*({fringe:.6,fairway:.8,rough:1,sand:1.25}[lie]||1)*(ch==='pitch'?.8:1.2)*clamp(1-(sh-75)*.014,.4,1.6)*(.4+rnd()*1.2);onGreen(st,ft);note='On the green, '+Math.round(st.ft)+' feet.';}
  }
  else if(ch==='layup'){st.dist=95+rnd()*20;st.lie=rnd()<.9?'fairway':'rough';note='Laid up to '+Math.round(st.dist)+' yards.';}
  else if(ch==='advance'){const adv=reachOf(c)*(st.lie==='fairway'?1:.8);st.dist=Math.max(60,st.dist-adv);st.lie=rnd()<.8?'fairway':'rough';note='Advanced to '+Math.round(st.dist)+' yards.';}
  else{
    const go=ch==='go',hero=ch==='hero';
    let pg=go?clamp(.62-(st.dist-200)/220+(pw-75)*.012-lieMal-(c.wf-1)*.5,.03,.8):clamp(.95-st.dist/400-lieMal+(app-75)*.012+(ch==='center'?.08:-.06)-(c.wf-1)*.5,.05,.96);
    if(hero)pg*=.55;
    if(rnd()<pg){const base=go?st.dist*.09+10:st.dist*.07+5;const ft=base*lieF*(ch==='attack'?.75:ch==='center'?1.25:1)*clamp(1-(app-75)*.01,.5,1.5)*c.wf*(.45+rnd()*1.1);onGreen(st,ft);note='On the green, '+Math.round(st.ft)+' feet.';}
    else{const wc=c.hi.water?(go?.4:ch==='attack'?.35:.15):0;
      if(rnd()<wc){st.strokes++;st.dist=30;st.lie='rough';note='In the water. Penalty drop.';}
      else if(hero&&rnd()<.5){st.dist=Math.max(40,st.dist-20);st.lie=rnd()<.4?'trees':'rough';note='Clips a branch.';}
      else{aroundGreen(st);note='Misses the green. '+LIE[st.lie]+', '+Math.round(st.dist)+' yards.';}}
  }
  if(!st.done&&st.lie==='green'&&st.ft<=1.2&&st.strokes<st.par+5){st.strokes++;st.done=true;note+=' Taps in.';}
  if(!st.done&&st.strokes>=st.par+5){st.done=true;note+=' Picks up.';}
  st.notes.push(note);st.trail.push({d:st.lie==='green'?0:st.dist,ft:st.ft,x:xFor(st.lie),lie:st.done?'hole':st.lie});
  return note;
}
function simHole(c,par,yds){const st=newHole(par,yds);let g=0;while(!st.done&&g++<12)doShot(c,st,stdChoice(c,st));return st.strokes-par;}
function calibrate(c,pars,yds,target){let lo=-30,hi=30;const N=90;

  c.off=(lo+hi)/2;}
function optEst(c,st,ch){const N=120;let s=0;for(let i=0;i<N;i++){const t=JSON.parse(JSON.stringify(st));doShot(c,t,ch);let g=0;while(!t.done&&g++<12)doShot(c,t,stdChoice(c,t));s+=t.strokes;}return s/N;}
function holeMapSVG(st,hi){

/* ============ season goals ============ */

  else{add('Win twice','wins',2);add('Post 6 top-10 finishes','t10',6);add('Finish top 10 on the money list','list',10);}

const CH_RE=/^CH-(\d{4})-(casual|pro|legend)-(club|college|phenom|amateur)-(main|euro)-(\d{1,2})-([A-Z0-9]{4})$/;
function parseCh(c){const p=(c||'').trim().split('-');if(p.length!==7||p[0].toUpperCase()!=='CH')return null;const m=CH_RE.exec('CH-'+p[1]+'-'+p[2].toLowerCase()+'-'+p[3].toLowerCase()+'-'+p[4].toLowerCase()+'-'+p[5]+'-'+p[6].toUpperCase());if(!m)return null;const y=clamp(+m[1],1960,2026);return{c:'CH-'+y+'-'+m[2]+'-'+m[3]+'-'+m[4]+'-'+m[5]+'-'+m[6],y,diff:m[2],bg:m[3],home:m[4]==='euro'&&y>=1972?'euro':'main',n:clamp(+m[5],1,20)};}
function mkCh(){const f=V.chf||{};const y=clamp(+f.y||1997,1960,2026);const r=Math.random().toString(36).slice(2,6).toUpperCase().replace(/[^A-Z0-9]/g,'X').padEnd(4,'X');return 'CH-'+y+'-'+(f.diff||'pro')+'-'+(f.bg||'college')+'-'+(f.home||'main')+'-'+(+f.n||5)+'-'+r;}
function chDesc(o){return o.y+' · '+DIFFS[o.diff].n+' · '+BGS[o.bg].n+' · '+(o.home==='euro'?'European Tour':'PGA Tour')+' · '+o.n+' season'+(o.n>1?'s':'');}
function chAll(){const made={},res={};for(const r of HOF.rows){for(const c of (r.ch||[])){if(!made[c.c])made[c.c]={...c,uid:r.uid};}for(const x of (r.chr||[]))(res[x.c]=res[x.c]||[]).push({...x,uid:r.uid});}
  for(const k in res){res[k].sort((a,b)=>(b.L||0)-(a.L||0));if(!made[k]){const p=parseCh(k);if(p)made[k]={...p,t:res[k][0].t||0};}}
  return Object.values(made).sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,8).map(c=>({c,res:res[c.c]||[]}));}

/* ============ weekly challenge ============ */
function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));return d.getUTCFullYear()+'-W'+String(Math.ceil(((d-y0)/864e5+1)/7)).padStart(2,'0');}
function weekly(){const wk=isoWeek(new Date());const r=mulberry(hash('wk'+wk));const key=['masters','usopen','open','pga'][Math.floor(r()*4)];let y=1962+Math.floor(r()*65);if(key==='open'&&y===2020)y=2021;
  const back=1+Math.floor(r()*3);const o=+(84.5+r()*4).toFixed(1);const ak=Object.keys(ARCH);const arch=ak[Math.floor(r()*ak.length)];
  const mn=MAJ.find(m=>m[0]===key)[1];return{wk,key,y,back,o,arch,mn,t:(key==='masters'?'The Masters':key==='open'?'The Open':key==='pga'?'The PGA Championship':'The U.S. Open')+', '+y};}

  try{seedRng(hash('wk'+W.wk));C.year=W.y;C.bg='college';C.arch=W.arch;C.diff='pro';C.home='main';C.mode='career';C.chal='';V.slot=0;
    startCareer();S.scen={...W};S.tour='main';S.pro=1;S.opt.live=true;S.opt.moments=false;S.guide={on:false,d:{}};
    const A=S.p.a;const cur=ovr(A);for(const k of['pow','acc','app','sho','put','men'])A[k]=clamp(A[k]+(W.o-cur),40,99);A.fit=85;S.p.birth=W.y-29;S.p.fame=40;S.p.energy=100;S.p.form=0;
    S.sched=buildSchedule(W.y);S.season=newSeason();let wi=S.sched.findIndex(w=>w.main.key===W.key);if(wi<0)wi=S.sched.findIndex(w=>w.main.type==='major');S.week=wi;
    const ev=S.sched[wi].main;S.scen.ev=ev.n;S.scen.cn=ev.cn;const T=newT(ev,W.y,true);S.T=T;T.wx=null;const me=T.E.find(e=>e.id==='me');
    for(let r=0;r<3;r++){simRoundAI(T);const v=Math.round(gauss()*1.6+(80-me.r)*K+courseOf(ev).diff);me.rd.push(v);me.tot+=v;afterRound(T);}
    me.cut=false;const best=Math.min(...T.E.filter(e=>!e.cut&&e.id!=='me').map(e=>e.tot));const d=best+W.back-me.tot;me.rd[2]+=d;me.tot+=d;

  }finally{seedRng(null);V.noSave=false;}
  V.screen='game';V.tab='home';}

  document.body.appendChild(el);document.body.classList.add('introing');

function runQuick(){const T=S.T;let g=0;while(!T.final&&g++<30){if(T.mp){mpQuickMe(T);continue;}if(T.live){liveAuto();continue;}const me=T.E.find(e=>e.id==='me');if(lastRound(T))T.__r3gap=me.tot-sorted(T)[0].tot;if(me.cut){simRoundAI(T);afterRound(T);}else playMyRound(null);}}
function finishEvent(){
  const T=S.T;
  if(S.scen){const me=T.E.find(e=>e.id==='me');S.scen.res={pos:me.pos||99,tie:!!me.tie,tot:me.tot};try{const b=wkBest();if(!b||wkScore(S.scen.res)<wkScore(b))localStorage.setItem('tourcard-weekly',JSON.stringify({wk:S.scen.wk,...S.scen.res}));}catch(e){}S.T=null;return;}
  S.T=null;if(T.wx&&T.wx.monday){S.p.energy=Math.max(0,S.p.energy-4);news('Rain pushed the '+T.ev.n+' to a Monday finish.','');}
  if(T.ev.tour==='q'){
    const me=T.E.find(e=>e.id==='me');const ok=me.pos<=25;const home=S.home||'main';
    if(ok){news('Card earned: '+S.p.name+' finishes '+(me.tie?'T':'')+me.pos+' at Q-School and joins the '+tourName(home)+'.','big');ach('card');}
    else news('Q-School ends at '+(me.tie?'T':'')+me.pos+'. It is the '+tourName('dev')+' for now.','me');
    S.tour=ok?home:'dev';S.pro=1;
    startSeason(T.start?S.year:S.year+1);
    save();return;
  }
  advanceWeek({played:pkey(T.ev),excl:T.ev.tour==='euro'?new Set(T.E.map(e=>e.id)):null});
}

function mgStart(){const d=curDrill();const k=primary(d);const A=S.p.a[k];MG={shots:[],pos:0,dir:1,speed:60,k,zw:clamp(7+(A-50)*.28,6,22),zc:25+rnd()*50,t:performance.now(),done:false};render();requestAnimationFrame(mgLoop);}
function mgLoop(t){if(!MG||MG.done)return;const dt=Math.min(.05,(t-MG.t)/1000);MG.t=t;MG.pos+=MG.dir*MG.speed*dt;if(MG.pos>100){MG.pos=200-MG.pos;MG.dir=-1;}if(MG.pos<0){MG.pos=-MG.pos;MG.dir=1;}const el=document.getElementById('mg-m');if(el)el.style.left=MG.pos+'%';requestAnimationFrame(mgLoop);}

function mgSwing(){if(!MG||MG.done)return;const dist=Math.abs(MG.pos-MG.zc),half=MG.zw/2;const sc=dist<=half?Math.round(100-50*dist/half):Math.max(0,Math.round(50-(dist-half)*6));MG.shots.push(sc);
  if(MG.shots.length>=5){MG.done=true;const avg=MG.shots.reduce((a,b)=>a+b,0)/5;const g=applyGains(curDrill().a,2,avg/100);S.tr.chalW=S.gw;S.tr.chal={avg,g,shots:MG.shots.slice()};save();}

      if(res&&res.n!==w.main.n)status=`<div class="small muted">Played: ${esc(res.n)}</div>`;}
    else{const em=elig(w.main);const p=S.plan[i]||'auto';
      const opts=[['auto','Auto'],...(w.main.type!=='team'&&(em.ok||em.invite)?[['main',em.ok?'Play':'Invite']]:[]),...(w.alt&&S.tour==='main'?[['alt','Opp.']]:[]),...(side?[['side','Play']]:[]),['rest','Rest']];
      right=`<div class="wplan">${opts.map(([k,n])=>`<button class="${p===k?'on':''}" data-a="splan" data-v="${i}:${k}" aria-pressed="${p===k}">${n}</button>`).join('')}</div>`;
      const st=w.main.type==='team'?(em.ok?'You are on the team':'Team event'):em.ok?'Eligible':em.qual?'Qualifying open':em.invite?'Sponsor invite available':S.tour!=='main'?'':'Not eligible';
      status=`<div class="small muted">${st}${cur?' · <strong style="color:var(--pine-l)">This week</strong>':''}</div>`;}
    const name=side&&S.tour!=='main'?side.n:w.main.n;const sub=side&&S.tour!=='main'?'PGA Tour: '+w.main.n:w.alt?'Same week: '+w.alt.n:'';
    return head+`<div class="wk ${cur?'cur':''} ${past?'past':''}" ${cur?'id="wk-cur"':''}><div class="wn">${i+1}</div><div class="wm"><div class="wt">${badge} ${esc(name)}</div>${sub?`<div class="small muted">${esc(sub)}</div>`:''}${status}</div>${right}</div>`;}).join('');
  const chip=(k,n)=>`<button class="${f===k?'on':''}" data-a="sfilt" data-v="${k}">${n}</button>`;
  return `<div class="board"><div class="bh"><span>${S.year} schedule</span><span>Week ${Math.min(S.week+1,N)} of ${N}</span></div><div class="bb">
    <div class="ssum"><div><b>${nextMaj>=0?nextMaj-S.week===0?'This week':'In '+(nextMaj-S.week)+' wk':'—'}</b><span>${nextMaj>=0?esc(S.sched[nextMaj].main.n):'No majors left'}</span></div><div><b>${pl}</b><span>Set to play</span></div><div><b>${rs}</b><span>Rest weeks</span></div></div>
    <div class="schips">${chip('up','Upcoming')}${chip('big','Big events')}${chip('past','Results')}${chip('all','Full year')}</div>
    <div class="row sbulk" style="margin:8px 0 4px"><button class="btn gh sm" data-a="sbulk" data-v="restpre">Rest before majors</button><button class="btn gh sm" data-a="sbulk" data-v="playall">Play every week</button><button class="btn gh sm" data-a="sbulk" data-v="clear">Reset to auto</button></div>
    <p class="small muted hide-m" style="margin:0 0 6px">Auto plays when energy is 40 or more and always plays the big events. Auto-play and Sim Season follow your picks.</p>
    <div class="wlist">${rows||'<p class="small muted">Nothing here.</p>'}</div></div></div>`;
}
function vSpon(){
  const tot=SLOTS.reduce((a,s)=>a+(S.spon[s]?S.spon[s].pay:0),0);
  return `<div class="g2"><div class="board"><div class="bh"><span>Your deals</span><span>${money(tot)} / yr</span></div><div class="bb">
    ${SLOTS.map(s=>{const c=S.spon[s];return `<div style="padding-block:10px;border-bottom:1px solid var(--line)"><div class="lbl">${SLOTN[s]}</div>${c?`<div class="cond" style="font-size:22px;font-weight:700;text-transform:uppercase">${esc(c.b)}</div><div class="small">${money(c.pay)} a year · ${c.life?'<strong>Lifetime deal</strong>':c.yrs+' yr left'} · with them since ${c.since||c.y} · ${fxText(c.fx)}</div><div class="small muted">Win bonus ${money(c.wb)} · Major bonus ${money(c.mb)} · ${clauseText(c.clause)}</div>`:`<div class="small muted">${S.p.fame<SLOTFAME[s]?'Brands in this category want more fame (needs about '+SLOTFAME[s]+').':'Open. Offers arrive at the start of a season and after wins.'}</div>`}</div>`;}).join('')}
  </div></div>
  <div class="board"><div class="bh"><span>Offers</span><span>Fame ${S.p.fame.toFixed(0)}</span></div><div class="bb">
    ${S.offers.length?S.offers.map((o,i)=>`<div style="padding-block:10px;border-bottom:1px solid var(--line)"><div class="lbl">${SLOTN[o.slot]}${o.renew?' · <span class="badge">Renewal</span>':S.spon[o.slot]?' · replaces '+esc(S.spon[o.slot].b)+' (buyout '+money(buyout(S.spon[o.slot]))+(o.slot==='clubs'||o.slot==='ball'?', six weeks to adjust':'')+')':''}</div><div class="cond" style="font-size:22px;font-weight:700;text-transform:uppercase">${esc(o.b)}</div>
      <div class="small">${money(o.pay)} a year ${o.life?'<strong>for life</strong>':'for '+o.yrs+' year'+(o.yrs>1?'s':'')} · ${fxText(o.fx)}</div><div class="small muted">Win bonus ${money(o.wb)} · Major bonus ${money(o.mb)} · ${clauseText(o.clause)}</div>
      <div class="row" style="margin-top:8px"><button class="btn dk sm" data-a="accept" data-v="${i}">Sign</button><button class="btn gh sm" data-a="decline" data-v="${i}">Decline</button></div></div>`).join(''):'<p class="small muted">No offers on the table. Win something.</p>'}
    <p class="small muted" style="margin:10px 0 0">Offers expire at season end. Equipment deals run 3 to 8 years, and stars can sign for life. Your current brands send renewal offers when a deal ends. Switching clubs or balls mid-deal costs a buyout and six weeks of getting used to them.</p>
  </div></div></div>`;
}
function vTeam(){
  const ci=costIdx(S.year);
  const grp=(k,title)=>`<div class="board"><div class="bh">${title}</div><div class="bb"><div class="opts" style="margin:0">${STAFF[k].map(x=>{const on=S.staff[k]===x.id;const cost=k==='caddie'?(x.pct*100)+'% of winnings'+(x.wk?' + '+money(x.wk*ci)+'/wk':''):x.yr?money(x.yr*ci)+' a year':'Free';
    return `<button class="opt ${on?'on':''}" data-a="hire" data-v="${k}:${x.id}"><span class="pct" style="font-size:15px">${on?'Hired':''}</span><b>${x.n}</b><span>${cost} · ${x.d}</span></button>`;}).join('')}</div></div></div>`;
  return `<p class="small" style="color:var(--txt-2);margin-bottom:14px">Staff are paid weekly from your bank. Costs scale with the era’s purses.</p><div class="g2"><div class="stack">${grp('caddie','Caddie')}${grp('coach','Coaching')}</div><div class="stack">${grp('fitness','Fitness')}${grp('psych','Mind')}${mentorBoard()}</div></div>`;
}
function medalTxt(c){const m=c.medals||[];if(!m.length)return c.oly?'0':'—';return MEDAL.map((k,i)=>m.filter(x=>x.m===k).length+['G','S','B'][i]).filter(x=>x[0]!=='0').join(' ');}
function vCareer(){
  const c=S.car;const lg=legacy();
  const yrs=[...new Set(S.res.filter(r=>r.key).map(r=>r.y))].sort();
  const mg=yrs.map(y=>`<tr><td style="font-weight:700">${y}</td>${MAJ.map(([k])=>{const r=S.res.find(x=>x.y===y&&x.key===k);if(!r)return '<td class="x">—</td>';return `<td class="${r.win?'w':r.pos&&r.pos<=10?'t':r.cut===false&&!r.pos?'x':''}${!r.pos?' x':''}">${r.posT}</td>`;}).join('')}</tr>`).join('');
  const h2=Object.entries(S.h2h).map(([id,v])=>[id,v,v[0]+v[1]]).sort((a,b)=>b[2]-a[2]).slice(0,10);
  const nem=Object.entries(S.nem).sort((a,b)=>b[1]-a[1])[0];
  const leg=[...LEGENDS.map(l=>({n:l[0],w:l[1],m:l[2]})),{n:S.p.name,w:c.wins,m:c.majors.length,me:1}].sort((a,b)=>b.m-a.m||b.w-a.w);
  return `<div class="stack">
  <div class="board"><div class="bh"><span>Career · ${S.y0}–${S.year}</span><span>${lg.tier}</span></div><div class="bb"><div class="stats">
   <div><b>${c.wins}</b><span>Tour wins</span></div><div><b>${c.majors.length}</b><span>Majors</span></div><div><b>${c.t10}</b><span>Top 10s</span></div><div><b>${c.events?Math.round(c.cuts/c.events*100):0}%</b><span>Cuts made</span></div>
   <div><b>${money(c.money)}</b><span>Prize money</span></div><div><b>${money(c.money26)}</b><span>In 2026 dollars</span></div><div><b>${money(c.spon)}</b><span>Endorsements</span></div><div><b>${c.best?'#'+c.best:'—'}</b><span>Best rank</span></div>
   <div><b>${c.wk1}</b><span>Weeks at No. 1</span></div><div><b>${c.rounds?tp(+(c.rel/c.rounds).toFixed(2)):'—'}</b><span>Avg to par</span></div><div><b>${c.cups.length}</b><span>Team cups</span></div><div><b>${c.euW||0}</b><span>${S.year>=2022?'DP World':'European'} wins</span></div><div><b>${c.devW+c.livW+c.senW}</b><span>Other pro wins</span></div><div><b>${c.amW||0}</b><span>Amateur wins</span></div><div><b>${(S.fxLog||[]).filter(x=>x.me).length}</b><span>FedEx Cups</span></div><div><b>${medalTxt(c)}</b><span>Olympic medals</span></div>
  </div></div></div>
  <div class="board"><div class="bh">World ranking over time</div><div class="bb">${rankChart()}</div></div><div class="board"><div class="bh">Income by season</div><div class="bb">${earnChart()}</div></div>
  <div class="g2"><div class="stack">
   <div class="board"><div class="bh">Major championship record</div><div class="bb">${yrs.length?`<div class="scroll"><table class="tbl mg"><thead><tr><th>Year</th>${MAJ.map(m=>`<th style="text-align:center">${m[1]}</th>`).join('')}</tr></thead><tbody>${mg}</tbody></table></div>`:'<p class="small muted">No major starts yet. Get inside the top 50 in the world, or try qualifying for the U.S. Open and The Open.</p>'}</div></div>
   <div class="board"><div class="bh">Trophy cabinet</div><div class="bb">${(c.medals||[]).map(m=>`<p class="small" style="margin:0 0 6px"><span class="badge ${m.m==='gold'?'':'gr'}">Olympic ${m.m}</span> ${olyInfo(m.y)[0]}</p>`).join('')}${c.trophies.length?`<div class="scroll"><table class="tbl"><tbody>${c.trophies.slice().reverse().map(t=>`<tr><td>${t.y}</td><td>${t.key?'<span class="badge red">Major</span> ':''}${t.eu?'<span class="badge gr">Europe</span> ':''}${esc(t.n)}</td><td class="n u">${tp(t.rel)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Empty for now.</p>'}</div></div>
   <div class="board"><div class="bh">Season by season</div><div class="bb"><div class="scroll"><table class="tbl"><thead><tr><th>Year</th><th>Tour</th><th class="n">Ev</th><th class="n">W</th><th class="n">T10</th><th class="n">Money</th><th class="n">List</th><th class="n">World</th></tr></thead><tbody>
    ${S.hist.slice().reverse().map(h=>`<tr><td>${h.y}</td><td>${tourName(h.tour,h.y)}</td><td class="n">${h.ev}</td><td class="n">${h.w}</td><td class="n">${h.t10}</td><td class="n">${money(h.money)}</td><td class="n">${h.mr?'#'+h.mr:'—'}</td><td class="n">${h.wr?'#'+h.wr:'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Your first season is under way.</td></tr>'}</tbody></table></div></div></div>
  </div><div class="stack">
   ${vRecords()}
   <div class="board"><div class="bh">Against the legends</div><div class="bb">${h2.length?`<table class="tbl"><thead><tr><th>Player</th><th class="n">You ahead</th><th class="n">They led</th></tr></thead><tbody>${h2.map(([id,v])=>`<tr><td>${esc(fn(id))}</td><td class="n">${v[0]}</td><td class="n">${v[1]}</td></tr>`).join('')}</tbody></table>`:'<p class="small muted">Finish ahead of real tour players to build head-to-head records.</p>'}
     ${nem?`<p class="small" style="margin:10px 0 0"><strong>Nemesis:</strong> ${esc(fn(nem[0]))} has won ${nem[1]} time${nem[1]>1?'s':''} while you finished in the top 5.</p>`:''}</div></div>
   <div class="board"><div class="bh">All-time majors list</div><div class="bb"><p class="small muted">Real PGA Tour wins and majors through the 2025 season.</p><table class="tbl"><thead><tr><th>Player</th><th class="n">Wins</th><th class="n">Majors</th></tr></thead><tbody>${leg.map(l=>`<tr class="${l.me?'me':''}"><td>${esc(l.n)}</td><td class="n">${l.w}</td><td class="n">${l.m}</td></tr>`).join('')}</tbody></table></div></div>
   <div class="board"><div class="bh"><span>Achievements</span><span>${Object.keys(S.ach).length}/${ACH.length}</span></div><div class="bb"><div class="ach">${ACH.map(([k,n,d])=>`<div class="${S.ach[k]?'got':''}"><b>${n}</b><span>${d}${S.ach[k]?' · '+S.ach[k].y:''}</span></div>`).join('')}</div></div></div>
   <div class="board"><div class="bh">Career card</div><div class="bb"><img class="ccard" alt="Career card for ${esc(S.p.name)}" src="${drawCard().toDataURL('image/png')}"><p class="small" style="margin:10px 0 6px;user-select:all">${esc(cardText())}</p><div class="row"><button class="btn dk sm" data-a="cardcopy">Copy summary</button>${DLNS?'<button class="btn gh sm" data-a="cardimg">Save as image</button>':''}${V.cardMsg?`<span class="small">${esc(V.cardMsg)}</span>`:''}</div></div></div>
   <div class="board"><div class="bh">Save code</div><div class="bb"><p class="small muted">Copy this code to move your career to another browser or device. On the title screen, open "Load a save code" and paste it.</p>${V.code?(V.code==='…'?'<p class="small">Packing your career…</p>':`<textarea id="code-out" readonly rows="3" style="width:100%;font:12px ui-monospace,Menlo,monospace">${esc(V.code)}</textarea><div class="row" style="margin-top:8px"><button class="btn dk sm" data-a="copycode">Copy code</button>${V.copied?'<span class="small">Copied.</span>':''}</div>`):'<button class="btn dk sm" data-a="mkcode">Create save code</button>'}</div></div>
   <div class="board"><div class="bh">Retirement</div><div class="bb">${V.confirmRetire?`<p>Retire now and see your legacy? This ends the career.</p><div class="row"><button class="btn dk" data-a="retire">Yes, retire</button><button class="btn gh" data-a="retq">Keep playing</button></div>`:`<p class="small muted">Hang up the spikes whenever you like. At 63 the decision is made for you.</p><button class="btn gh" data-a="retq">Retire…</button>`}</div></div>
  </div></div></div>`;
}
function vLegacy(){
  const c=S.car,lg=legacy();
  const leg=[...LEGENDS.map(l=>({n:l[0],w:l[1],m:l[2]})),{n:S.p.name,w:c.wins,m:c.majors.length,me:1}].sort((a,b)=>b.m-a.m||b.w-a.w);
  const place=leg.findIndex(l=>l.me)+1;
  const mk=MAJ.map(([k,n])=>n+' '+c.majors.filter(m=>m.key===k).length).join(' · ');
  return `<div class="title" style="padding-block:30px 20px"><div class="lbl" style="color:var(--txt-2)">${S.y0}–${S.retY} · ${esc(S.p.ctry)}</div>
   <div class="pname" style="font-size:clamp(40px,8vw,72px)">${esc(S.p.name)}</div><div class="tsub">${lg.tier}${lg.hof?'. Inducted into the World Golf Hall of Fame.':'.'}</div></div>
  <div class="g2"><div class="board"><div class="bh">The record</div><div class="bb"><div class="stats">
    <div><b>${c.wins}</b><span>Tour wins</span></div><div><b>${c.majors.length}</b><span>Majors</span></div><div><b>${c.t10}</b><span>Top 10s</span></div><div><b>${c.best?'#'+c.best:'—'}</b><span>Best rank</span></div>
    <div><b>${c.wk1}</b><span>Weeks at No. 1</span></div><div><b>${money(c.money26+c.spon26)}</b><span>Career income, 2026 $</span></div><div><b>${c.cups.length}</b><span>Team cups</span></div><div><b>${c.cupPts}</b><span>Cup points</span></div><div><b>${medalTxt(c)}</b><span>Olympic medals</span></div>
    </div><p class="small" style="margin:12px 0 0">${mk}. ${c.senW?c.senW+' Senior Tour wins. ':''}${c.livW?c.livW+' LIV wins. ':''}${Object.keys(S.ach).length} of ${ACH.length} achievements.</p>
    <p style="margin:12px 0 0">Legacy score <strong>${lg.L.toFixed(1)}</strong>. Your ${ord(place)} on the all-time list below.</p>
    <div class="row" style="margin-top:14px">${HOF.db&&HOF.uid?(S.hofAdded?'<span class="small">Your career is up on the clubhouse wall.</span>':'<button class="btn dk" data-a="hofadd">Add to the clubhouse Hall of Fame</button>'):''}<button class="btn" data-a="newgame">Back to the title screen</button></div>${V.hofErr?`<p class="small" style="color:var(--red)">${esc(V.hofErr)}</p>`:''}
    <img class="ccard" style="margin-top:14px" alt="Career card" src="${drawCard().toDataURL('image/png')}"><div class="row" style="margin-top:8px"><button class="btn gh sm" data-a="cardcopy">Copy summary</button>${DLNS?'<button class="btn gh sm" data-a="cardimg">Save as image</button>':''}${V.cardMsg?`<span class="small">${esc(V.cardMsg)}</span>`:''}</div></div></div>
  <div class="stack"><div class="board"><div class="bh">Where you rank</div><div class="bb"><table class="tbl"><thead><tr><th>#</th><th>Player</th><th class="n">Wins</th><th class="n">Majors</th></tr></thead><tbody>${leg.map((l,i)=>`<tr class="${l.me?'me':''}"><td>${i+1}</td><td>${esc(l.n)}</td><td class="n">${l.w}</td><td class="n">${l.m}</td></tr>`).join('')}</tbody></table></div></div>${hofBoard()}</div></div>`;
}

/* ============ boot ============ */
function start(d){migrateOld();capsBoot();const hot=!!(d&&d.S);if(hot){S=d.S;migrate();V=Object.assign(V,d.V||{});computeRanks();}render();if(!hot&&V.screen==='title'&&introPref()&&!introSeen())runIntro();}
try{window.claude?.hot?.snapshot?.(()=>({S,V}));}catch(e){}
try{window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});}catch(e){start({});}
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}</script>
</body>
</html>
